<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Mini Dash Player</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- added to the Home Screen it opens as a full-screen app, without Safari's bars -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mini Dash">
<meta name="theme-color" content="#0b0d1a">
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&display=swap">
<style>
  /* One dark arcade screen: a start card (import + controls), then the game
     full screen in landscape. Deliberately single-theme, colors set explicitly. */
  :root {
    --night: #0b0d1a;
    --panel: #161a33;
    --ink: #eef0ff;
    --dim: #a3a9cf;
    --cyan: #3ee6ff;
    --line: rgba(238,240,255,.16);
    --warn: #ffb547;
    --display: "Bungee", "Arial Black", Impact, sans-serif;
    --body: -apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--night); color: var(--ink); font: 16px/1.6 var(--body); overflow: hidden;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

  /* ---------- start card ---------- */
  #menu { height: 100%; overflow-y: auto; display: grid; place-items: center;
    padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: radial-gradient(120% 70% at 50% 120%, rgba(62,230,255,.16), transparent 60%), var(--night); }
  .card { width: 100%; max-width: 460px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    padding: 26px 22px 22px; display: grid; gap: 16px; }
  h1 { margin: 0; font: 400 clamp(34px, 9vw, 44px)/1 var(--display); letter-spacing: .02em; text-shadow: 3px 3px 0 rgba(62,230,255,.35); }
  .btn { appearance: none; display: flex; align-items: center; justify-content: center; width: 100%; min-height: 54px;
    padding: 12px 18px; border-radius: 14px; border: 0; font: 700 18px/1.2 var(--body); cursor: pointer; }
  .btn.primary { background: var(--cyan); color: #04121a; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); min-height: 46px; font-size: 16px; }
  .btn:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
  .btn[disabled] { opacity: .5; }
  h2 { margin: 4px 0 0; font: 700 15px/1.3 var(--body); color: var(--cyan); letter-spacing: .04em; }
  ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 15px; color: var(--dim); }
  li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; }
  li > span { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: rgba(238,240,255,.1);
    color: var(--ink); font: 700 13px/1 var(--body); }
  li b { color: var(--ink); font-weight: 700; }
  .quality { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; color: var(--dim); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .seg button { appearance: none; border: 0; background: transparent; color: var(--ink); font: 700 15px/1 var(--body);
    min-height: 40px; padding: 0 18px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--cyan); color: #04121a; }
  .hint { margin: 0; font-size: 14px; color: var(--dim); }
  .hint b { color: var(--ink); }
  #status { margin: 0; font-size: 14px; color: var(--warn); }
  #status:empty { display: none; }
  #bar { height: 8px; border-radius: 4px; background: rgba(238,240,255,.12); overflow: hidden; }
  #bar > i { display: block; height: 100%; width: 0; background: var(--cyan); transition: width .2s; }

  /* ---------- game ---------- */
  #game { position: fixed; inset: 0; background: #000; display: none; place-items: center; touch-action: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  body.playing #game { display: grid; }
  body.playing #menu { display: none; }
  #box { position: relative; touch-action: none; overflow: hidden; }
  /* the game is laid out at the phone's real pixel size and shrunk back down, so it draws sharp */
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #stage > * { width: 100%; height: 100%; display: block; }
  #fsBtn { position: absolute; z-index: 5; top: max(6px, env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
    display: none; width: 40px; height: 32px; padding: 0; border: 0; border-radius: 8px; background: rgba(0,0,0,.35); color: #fff;
    font: 700 20px/32px var(--body); cursor: pointer; }
  body.canFs:not(.isFs) #fsBtn { display: block; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 16px; pointer-events: none; }

  #rotate { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; text-align: center; background: var(--night);
    padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    font-size: 20px; font-weight: 700; }
  body.needRotate #rotate { display: grid; }
  #rotate .phone { width: 46px; height: 76px; border: 3px solid var(--ink); border-radius: 9px; margin: 0 auto 18px; animation: turn 2s ease-in-out infinite; }
  @keyframes turn { 0%,25% { transform: rotate(0) } 60%,100% { transform: rotate(-90deg) } }
  @media (prefers-reduced-motion: reduce) { #rotate .phone { animation: none; transform: rotate(-90deg); } }
</style>

<main id="menu">
  <div class="card">
    <h1>Mini Dash</h1>
    <button id="play" class="btn primary" disabled>加载中&hellip;</button>
    <div id="bar" hidden><i></i></div>
    <p id="status" role="status"></p>
    <button id="retry" class="btn ghost" hidden>重试</button>
    <div class="quality"><span>画质</span>
      <div id="quality" class="seg" role="group" aria-label="画质">
        <button type="button" data-q="smooth">流畅</button><button type="button" data-q="sharp">清晰</button>
      </div>
    </div>
    <p id="fsHint" class="hint" hidden>想要全屏玩：点 Safari 的 <b>分享</b> 按钮 &rarr; <b>添加到主屏幕</b>，以后从主屏幕的 Mini Dash 图标打开。</p>

    <h2>操作方法</h2>
    <ol>
      <li><span>&#8635;</span><div>把手机<b>横过来</b>玩。</div></li>
      <li><span>&#9664;</span><div>游戏左下角的 <b>&#9664; &#9654;</b>：左右移动。</div></li>
      <li><span>&#9650;</span><div>点屏幕<b>其他任何地方</b>：跳跃。</div></li>
      <li><span>&#9733;</span><div>用英雄时，点游戏里的<b>圆形按钮</b>：放特技。</div></li>
    </ol>
  </div>
</main>

<section id="game" aria-label="Mini Dash">
  <button id="fsBtn" aria-label="全屏" title="全屏">&#x26F6;</button>
  <div id="box">
    <div id="loading">加载中，请稍等&hellip;</div>
    <div id="stage"></div>
  </div>
</section>

<div id="rotate"><div><div class="phone"></div>请把手机横过来</div></div>

<script>
// Audio must behave like a game's, not a music player's: set before any audio starts. The game's
// sounds are played by this page; Ruffle's own audio output is unused, and left running it keeps
// iOS showing the page in Now Playing, so any audio context that isn't ours stays suspended.
(function () {
  try { if (navigator.audioSession) navigator.audioSession.type = 'ambient'; } catch (e) {}
  ['AudioContext', 'webkitAudioContext'].forEach(function (n) {
    var C = window[n]; if (!C) return;
    var W = function (opts) {
      var c = opts === undefined ? new C() : new C(opts);
      if (!window.__mdOwnAudio) {
        try { c.suspend(); } catch (e) {}
        c.resume = function () { return Promise.resolve(); };
      }
      return c;
    };
    W.prototype = C.prototype;
    window[n] = W;
  });
})();
</script>
<script src="ruffle/ruffle.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function say(t) { $('status').textContent = t || ''; }

  var DB = 'minidash', STORE = 'files', KEY = 'bundled';

    return new Promise(function (res, rej) {

      tx.oncomplete = res; tx.onerror = function () { rej(tx.error); };

  }
  function loadSaved() {

    return idb().then(function (db) { var tx = db.transaction(STORE, 'readwrite'); tx.objectStore(STORE).delete(key); }).catch(function () {});

  }

    $('bar').hidden = false; $('bar').firstChild.style.width = Math.round(p * 100) + '%';

  function remoteTag() {
    return fetch(GAME_URL, { method: 'HEAD', cache: 'no-store' }).then(function (r) {

    return fetch(GAME_URL, { cache: 'no-store' }).then(function (r) {

        return reader.read().then(function (s) {

            parts.forEach(function (p) { out.set(p, at); at += p.length; });

      if (buf.byteLength < 8 || !isSwf(buf)) throw new Error('not a swf');
      var rec = { name: GAME_URL, data: buf, tag: tag };

    $('retry').hidden = true; say('');
    Promise.all([loadSaved(), remoteTag()]).then(function (r) {

      if (!tag) throw new Error('offline');
      return download(tag).then(ready, function (e) { if (cached) ready(cached); else throw e; });
    }).catch(function () {
      $('bar').hidden = true; $('play').textContent = '加载失败';
      say('游戏下载失败，请检查网络后重试。'); $('retry').hidden = false;
    });
  }
  boot();
  $('retry').addEventListener('click', boot);
  // ---------- full screen ----------
  // Browsers that allow it go full screen on the Play tap; iPhone Safari doesn't, but the page
  // installs as a Home Screen app that opens without Safari's bars (see the hint).

    try {
      var r = root.requestFullscreen ? root.requestFullscreen({ navigationUI: 'hide' }) : root.webkitRequestFullscreen();

        try { screen.orientation.lock('landscape').catch(function () {}); } catch (e) {}
      }, function () {});
    } catch (e) {}

  document.body.classList.toggle('canFs', canFs);
  $('fsHint').hidden = installed || canFs || !/iPhone|iPod/.test(navigator.userAgent);
  document.addEventListener('fullscreenchange', fsChanged);
  document.addEventListener('webkitfullscreenchange', fsChanged);
  $('fsBtn').addEventListener('click', goFs);

  $('play').addEventListener('click', function () {
    Sound.unlock(); if (!game) return;
    if (!canFs || isFs()) { start(game); return; }

    var go = function () { document.removeEventListener('fullscreenchange', go); document.removeEventListener('webkitfullscreenchange', go);
      if (go.done) return; go.done = true; setTimeout(function () { start(game); }, 150); };

    setTimeout(go, 800);

      __mdMusicOn: function (a) { musicOn = a !== '0'; gains(); if (!musicOn) stopMusic(); else if (music.id != null && !music.src) startMusic(); },
      __mdPaused: function (a) { paused = a !== '0'; if (ctx && !hidden) { try { paused ? ctx.suspend() : ctx.resume(); } catch (e) {} } },
      __mdMusicVol: function (a) { musicVol = vol(a); gains(); }
    };

      swfLength: swfLength,

        try { var b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(0); } catch (e) {}
        if (music.id != null && !music.src && musicOn) startMusic();
      },
      handle: function (cmd, args) { var h = H[cmd]; if (!h) return false; try { h(args); } catch (e) {} return true; },
      // silent while the page is in the background, like a game
      background: function (isHidden) {
        hidden = isHidden; if (!ctx) return;
        try { if (hidden) ctx.suspend(); else if (!paused) ctx.resume(); } catch (e) {}
      },
      reset: function () { stopAllSfx(); stopMusic(); music.id = null; sfxBySlot = {}; streamById = {}; soundOn = musicOn = true; paused = false; gains(); }
    };
  })();
  document.addEventListener('visibilitychange', function () { Sound.background(document.hidden); });
  window.addEventListener('pagehide', function () { Sound.background(true); });
  window.addEventListener('pageshow', function () { Sound.background(document.hidden); });
  // only real user input can unlock audio; the keys synthesized for touch controls are skipped
  ['pointerdown', 'touchend', 'keydown'].forEach(function (t) { window.addEventListener(t, function (e) { if (e.isTrusted) Sound.unlock(); }, true); });

  // ---------- full-screen game box ----------
  // The game sizes its own layout to this box's shape when it starts, so the
  // shape is chosen once (landscape) and kept afterwards.
  var MIN_R = 1.3, MAX_R = 2.4, shape = null;
  // real pixels per CSS pixel; capped at 2 so 3x phones don't render 2.25x the pixels for no visible gain
  // Sharp: up to 2 real pixels per CSS pixel. Smooth: 1, a quarter of the pixels to draw, the
  // default for the Home Screen app, which fills the whole screen and runs slower on iPhone.
  var QKEY = 'minidash.quality', quality = null, DPR = window.devicePixelRatio || 1;
  try { quality = localStorage.getItem(QKEY); } catch (e) {}
  if (quality !== 'smooth' && quality !== 'sharp') quality = installed ? 'smooth' : 'sharp';
  var SHARP;
  function setQuality(q) {
    quality = q; try { localStorage.setItem(QKEY, q); } catch (e) {}
    SHARP = q === 'smooth' ? 1 : Math.max(1, Math.min(2, DPR));
    [].forEach.call($('quality').children, function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-q') === q)); });
  }
  setQuality(quality);
  $('quality').addEventListener('click', function (e) { var q = e.target.getAttribute && e.target.getAttribute('data-q'); if (q) setQuality(q); });
  function area() {
    var g = $('game'), cs = getComputedStyle(g);
    return { w: g.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight),
             h: g.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) };
  }
  function fit() {
    if (!document.body.classList.contains('playing')) return;
    var A = area(); if (A.w <= 0 || A.h <= 0) return;
    var r = shape || Math.min(MAX_R, Math.max(MIN_R, A.w / A.h));
    var w = A.w, h = A.w / r;
    if (h > A.h) { h = A.h; w = A.h * r; }
    w = Math.floor(w); h = Math.floor(h);
    $('box').style.width = w + 'px'; $('box').style.height = h + 'px';
    var st = $('stage').style;
    st.width = Math.round(w * SHARP) + 'px'; st.height = Math.round(h * SHARP) + 'px';
    st.transform = 'scale(' + (1 / SHARP) + ')';
  }
  function portrait() { return window.innerHeight > window.innerWidth; }
  window.addEventListener('resize', function () { fit(); checkRotate(); });
  window.addEventListener('orientationchange', function () { setTimeout(function () { fit(); checkRotate(); }, 250); });

  // ---------- the player ----------
  var player = null, pendingRec = null;
  function checkRotate() {
    var need = document.body.classList.contains('playing') && portrait();
    document.body.classList.toggle('needRotate', need);
    if (!need && pendingRec) { var r = pendingRec; pendingRec = null; setTimeout(function () { launch(r); }, 300); }
  }
  function start(rec) {
    if (!window.RufflePlayer) { say('游戏播放器没有加载成功，请检查网络后刷新页面。'); return; }
    document.body.classList.add('playing');
    if (portrait()) { pendingRec = rec; checkRotate(); return; }
    launch(rec);
  }
  function launch(rec) {
    shape = null; fit();
    var A = $('box').getBoundingClientRect(); shape = A.width / A.height;
    $('loading').style.display = 'grid'; $('stage').innerHTML = '';
    Sound.reset(); ctl.reset();
    // Ruffle sizes the game's stage in CSS pixels; with the stage enlarged above and the
    // pixel ratio reported as 1, the game's own drawing surface gets one pixel per screen pixel.
    try { Object.defineProperty(window, 'devicePixelRatio', { configurable: true, get: function () { return 1; } }); } catch (e) {}
    window.RufflePlayer.config = {
      autoplay: 'on', unmuteOverlay: 'hidden', splashScreen: false, letterbox: 'off', backgroundColor: '#000000',
      contextMenu: 'off', allowScriptAccess: true, openUrlMode: 'deny', warnOnUnsupportedContent: false,
      showSwfDownload: false, quality: 'high', logLevel: 'error', maxExecutionDuration: 120
    };
    try { player = window.RufflePlayer.newest().createPlayer(); }
    catch (e) { fail(); return; }
    $('stage').appendChild(player);
    player.onFSCommand = function (cmd, args) { args = String(args == null ? '' : args); return ctl.handle(cmd, args) || Sound.handle(cmd, args); };
    var ready = function () { $('loading').style.display = 'none'; };
    player.addEventListener('loadedmetadata', ready);
    Sound.loadPack(rec.data);
    var api = player.ruffle ? player.ruffle() : player;
    Promise.resolve(api.load({ data: rec.data.slice(0, Sound.swfLength(rec.data)), swfFileName: 'MiniDash.swf' })).then(ready).catch(fail);
  }
  function fail() {
    try { if (player && player.remove) player.remove(); } catch (e) {}
    player = null; $('stage').innerHTML = '';
    document.body.classList.remove('playing', 'needRotate');
    say('游戏没有启动成功，请刷新页面再试一次。');
  }

  // Ruffle only reads keys while its own element has focus.
  // Cheap when the game already has focus (the common case on every press).
  var focusTarget = null;
  function focusGame() {
    if (!player || document.activeElement === player) return;
    try {
      if (!focusTarget || !focusTarget.isConnected) {
        focusTarget = null;
        var sr = player.shadowRoot;
        if (sr) { var all = sr.querySelectorAll('[tabindex]'); if (all.length) focusTarget = all[0]; }
      }
      (focusTarget || player).focus({ preventScroll: true });
    } catch (e) {}
  }

  // ---------- touch controls (only while a level is being played) ----------
  // The game draws its own arrow pod and special button; this maps touches
  // on them (and everywhere else = jump) to keys, with any number of fingers.
  var ctl = (function () {
    var K = { L: ['ArrowLeft', 'ArrowLeft', 37], R: ['ArrowRight', 'ArrowRight', 39], J: [' ', 'Space', 32], S: ['ArrowDown', 'ArrowDown', 40] };
    var geo = null, inQuest = false, paused = false, ended = false;
    var held = {}, ptrs = {};
    function key(k, type) {
      window.dispatchEvent(new KeyboardEvent(type, { key: K[k][0], code: K[k][1], keyCode: K[k][2], which: K[k][2], bubbles: true, cancelable: true }));
    }
    function press(k) { focusGame(); held[k] = (held[k] || 0) + 1; if (held[k] === 1) key(k, 'keydown'); }
    function lift(k) { if (!held[k]) return; held[k]--; if (!held[k]) key(k, 'keyup'); }
    function releaseAll() { Object.keys(ptrs).forEach(function (id) { var p = ptrs[id]; if (p.k) lift(p.k); }); ptrs = {}; }
    function active() { return inQuest && !paused && !ended && geo; }
    function logical(e) {
      var r = $('box').getBoundingClientRect();
      return { x: (e.clientX - r.left) * geo.MAXX / r.width, y: (e.clientY - r.top) * geo.MAXY / r.height };
    }
    function zone(p) {
      var g = geo, wr = g.wr > 0 ? g.wr : 60;
      if (p.x > g.MAXX - 58 && p.y < 58) return null;                                   // the game's pause button
      if (g.special) {
        var br = (g.br > 0 ? g.br : 40) * 1.35;
        if (Math.pow(p.x - (g.MAXX - 160), 2) + Math.pow(p.y - g.ay, 2) < br * br) return 'S';
      }
      var near = Math.pow(p.x - g.cx, 2) + Math.pow(p.y - g.cy, 2) < Math.pow(wr * 1.6, 2);
      var corner = p.x < g.cx + wr * 1.3 && p.y > g.cy - wr * 1.4;                       // generous bottom-left area
      if (near || corner) return p.x < g.cx ? 'L' : 'R';
      return 'J';
    }
    var box = $('box');
    box.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' || !active()) return;                                // menus, pause, results: normal taps
      var z = zone(logical(e)); if (!z) return;                                          // in-game buttons: normal taps
      e.preventDefault(); e.stopPropagation();
      try { box.setPointerCapture(e.pointerId); } catch (_) {}
      ptrs[e.pointerId] = { k: z, move: z === 'L' || z === 'R' };
      press(z);
    }, true);
    box.addEventListener('pointermove', function (e) {
      var p = ptrs[e.pointerId]; if (!p) return;
      e.preventDefault(); e.stopPropagation();
      if (p.move && geo) {
        var d = logical(e).x < geo.cx ? 'L' : 'R';
        if (d !== p.k) { lift(p.k); p.k = d; press(d); }
      }
    }, true);
    function up(e) {
      var p = ptrs[e.pointerId]; if (!p) return;
      e.preventDefault(); e.stopPropagation();
      delete ptrs[e.pointerId]; lift(p.k);
    }
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (t) { box.addEventListener(t, up, true); });
    ['touchstart', 'touchmove', 'touchend'].forEach(function (t) {
      box.addEventListener(t, function (e) { if (Object.keys(ptrs).length) e.preventDefault(); }, { passive: false, capture: true });
    });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    window.addEventListener('blur', releaseAll);

    var H = {
      __mdQuest: function (a) {
        var v = a.split(',').map(Number);
        geo = { MAXX: v[0] || 480, MAXY: v[1] || 320, cx: v[2], cy: v[3], wr: v[4], br: v[5], ay: v[7], special: v[6] >= 1 && v[6] <= 5 };
        inQuest = true; paused = false; ended = false; focusGame();
      },
      __mdRespawn: function (a) { ended = false; paused = false; if (geo) geo.special = +a >= 1 && +a <= 5; },
      __mdQuestEnd: function () { inQuest = false; releaseAll(); },
      __mdPause: function (a) { var p = a === '1'; if (p && !paused) releaseAll(); paused = p; },
      __mdLevelEnd: function () { ended = true; releaseAll(); }
    };
    return {
      handle: function (cmd, args) { var h = H[cmd]; if (!h) return false; try { h(args); } catch (e) {} return true; },
      reset: function () { releaseAll(); geo = null; inQuest = paused = ended = false; }
    };
  })();
})();
</script>

</body>
